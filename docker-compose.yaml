# Fixed project name: `docker compose up` gives the same containers from any
# checkout or worktree of the repo, instead of one project per folder (whose
# container names clash).
name: offices-api

services:
  mysql:
    image: mysql:8.0
    container_name: office-db
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: my_database
      MYSQL_USER: my_user
      MYSQL_PASSWORD: my_password
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"

# Docker-managed volume, so the data doesn't depend on the folder compose
# runs from. A fixed name keeps it the same whatever the project is called.
# Wipe the database with: docker compose down -v
volumes:
  mysql-data:
    name: offices-api-mysql-data
