# Fixed project name: `docker compose up` gives the same containers from any
# checkout or worktree of the repo, instead of one project per folder (whose
# container names clash).
name: offices-api

services:
  kafka:
    image: apache/kafka:3.7.0
    restart: on-failure
    container_name: kafka
    ports:
      - 9092:9092
    environment:
      # Single node in KRaft mode (broker + controller, no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT for the apps on the host, INTERNAL for other containers (kafka-init)
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # Creates every topic up front: KafkaJS crashes if a topic is still being
  # auto-created when the apps first connect. Each request topic used with
  # ClientKafka.send needs a matching ".reply" topic.
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          echo "Waiting for Kafka..."; sleep 2
        done
        for topic in office-notifications office-create-project-post office-like-project-post office-unlike-project-post; do
          for name in "$$topic" "$$topic.reply"; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$name" --partitions 3 --replication-factor 1
          done
        done
        echo "Kafka topics ready."

  mysql:
    image: mysql:8.0
    container_name: office-db
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: my_database
      MYSQL_USER: my_user
      MYSQL_PASSWORD: my_password
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
  redis:
    image: redis:latest
    container_name: office-cache
    ports:
      - "6379:6379"
  mongodb:
    image: mongo:7.0
    container_name: office-nosql
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

# Docker-managed volumes, so the data doesn't depend on the folder compose
# runs from. Fixed names keep them the same whatever the project is called.
# Wipe the databases with: docker compose down -v
volumes:
  mysql-data:
    name: offices-api-mysql-data
  mongo-data:
    name: offices-api-mongo-data
